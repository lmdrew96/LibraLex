<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · LibraLex</title>
    <!-- Self-contained on purpose: served by the service worker with no network,
         so no external fonts/scripts/styles. Colors mirror app/globals.css. -->
    <style>
      :root {
        --surface: #ebeed5;
        --card: #f7f8ee;
        --ink: #41386b;
        --lavender: #b1b4c8;
      }
      html.dark {
        --surface: #201c36;
        --card: #41386b;
        --ink: #ebeed5;
        --lavender: #77778e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--surface);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        padding: 32px 24px;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--lavender);
        border-radius: 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.75rem;
        font-weight: 600;
      }
      p { margin: 0 0 24px; line-height: 1.5; opacity: 0.9; }
      button {
        min-height: 44px;
        padding: 0 24px;
        border: 0;
        border-radius: 9999px;
        background: var(--ink);
        color: var(--surface);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:focus-visible { outline: 2px solid var(--lavender); outline-offset: 3px; }
    </style>
    <script>
      // Same theme logic as app/layout.tsx (storage key "libralex-theme").
      ;(function () {
        try {
          var t = localStorage.getItem("libralex-theme")
          var d =
            t === "dark" ||
            ((t === null || t === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
          if (d) document.documentElement.classList.add("dark")
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>
        Your shelf will be right here when you’re back online. Nothing you’ve saved
        is lost.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Come back on our own once the connection returns.
      window.addEventListener("online", function () { location.reload() })
    </script>
  </body>
</html>
